plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def nequiDeviceKey = (localProps.getProperty('nequi.deviceKey')
        ?: System.getenv('NEQUI_DEVICE_KEY')
        ?: '').trim()
def apiBaseUrl = (localProps.getProperty('nequi.apiBaseUrl')
        ?: 'https://sistema-validacion-pagos-qr-production.up.railway.app').trim()

android {
    namespace 'com.drogueriasortega.nequicapture'
    compileSdk 35

    defaultConfig {
        applicationId "com.drogueriasortega.nequicapture"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "1.0.4"

        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        buildConfigField "String", "NEQUI_DEVICE_KEY", "\"${nequiDeviceKey}\""
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
}
